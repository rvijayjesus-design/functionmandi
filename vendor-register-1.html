<h1>Vendor Registration</h1>

<p>Register your business and start receiving bookings.</p>

<form>

<input type="text" placeholder="Business Name" required><br><br>

<input type="text" placeholder="Owner Name" required><br><br>

<input type="email" placeholder="Email Address" required><br><br>

<input type="tel" placeholder="Mobile Number" required><br><br>

<input type="text" placeholder="Service Category" required><br><br>

<input type="text" placeholder="City" required><br><br>

<textarea placeholder="Business Description"></textarea><br><br>

<label>Upload Aadhaar / GST Certificate (for Verified Badge)</label><br>
<input type="file" accept="image/*,.pdf"><br><br>
<p style="font-size:13px;color:#777;">Verified vendors get a ✅ badge and appear higher in search results.</p>

<button type="button" class="btn">
Register Vendor
