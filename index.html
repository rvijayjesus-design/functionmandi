<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FunctionMandi - Find Vendors Across India</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#ff6b00;
color:white;
padding:18px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.hero{
padding:40px 20px;
text-align:center;
background:white;
}

.hero h1{
font-size:32px;
margin-bottom:10px;
}

.hero p{
color:#666;
margin-bottom:20px;
}

.search{
width:90%;
max-width:500px;
padding:14px;
border-radius:8px;
border:1px solid #ccc;
font-size:18px;
}

.categories{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:15px;
padding:25px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
text-align:center;
box-shadow:0 3px 8px rgba(0,0,0,.1);
cursor:pointer;
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card h3{
margin-top:10px;
}

footer{
background:#222;
color:white;
text-align:center;
padding:18px;
margin-top:30px;
}
</style>

</head>

<body>

<header>

FunctionMandi

</header>

<section class="hero">

<h1>Find Event Vendors Across India</h1>

<p>Wedding • Birthday • Corporate • Party • Photography • Catering • DJ</p>

<input class="search" placeholder="Search Vendors...">

</section>

<section class="categories">

<div class="card">
<h3>Wedding</h3>
</div>

<div class="card">
<h3>Catering</h3>
</div>

<div class="card">
<h3>Photography</h3>
</div>

<div class="card">
<h3>DJ</h3>
</div>

<div class="card">
<h3>Decoration</h3>
</div>

<div class="card">
<h3>Makeup Artist</h3>
</div>

<div class="card">
<h3>Hotels</h3>
</div>

<div class="card">
<h3>Travels</h3>
</div>

</section>

<footer>

© 2026 FunctionMandi. All Rights Reserved.

</footer>

</body>
</html>
