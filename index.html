<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FunctionMandi</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5}
header{background:#ff6b00;color:#fff;padding:16px;text-align:center}
.hero{padding:60px 20px;text-align:center;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;padding:20px}
.card{background:#fff;padding:16px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
footer{background:#222;color:#fff;text-align:center;padding:20px;margin-top:20px}
button{background:#ff6b00;color:#fff;border:none;padding:10px 18px;border-radius:8px}
</style>
</head>
<body>
<header><h1>FunctionMandi</h1></header>
<section class="hero">
<h2>Find the Perfect Vendor</h2>
<p>Photography • Catering • Decoration • Makeup • DJ</p>
<input placeholder="Search vendors" style="padding:10px;width:70%;max-width:400px"><br><br>
<button onclick="alert('Search feature coming soon!')">Search</button>
</section>
<section class="grid">
<div class="card"><h3>Photography</h3></div>
<div class="card"><h3>Catering</h3></div>
<div class="card"><h3>Decoration</h3></div>
<div class="card"><h3>DJ</h3></div>
<div class="card"><h3>Makeup</h3></div>
<div class="card"><h3>Mehendi</h3></div>
</section>
<footer>© 2026 FunctionMandi</footer>
</body></html>
