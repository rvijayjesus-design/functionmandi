<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | FunctionMandi</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="logo">🎉 FunctionMandi</div>
</header>

<section class="featured">
    <h1>Create Your Account</h1>
    <p>Sign up to book trusted vendors.</p>

    <form>
        <input type="text" placeholder="Full Name" required><br><br>

        <input type="email" placeholder="Email Address" required><br><br>

        <input type="tel" placeholder="Mobile Number" required><br><br>

        <input type="password" placeholder="Password" required><br><br>

        <button type="button" class="btn" onclick="signup()">
            Sign Up
        </button>
    </form>

    <p>
        Already have an account?
        <a href="login.html">Login</a>
    </p>
</section>

<footer>
    <p>© 2026 FunctionMandi. All Rights Reserved.</p>
</footer>

<script src="js/app.js"></script>

</body>
</html>
